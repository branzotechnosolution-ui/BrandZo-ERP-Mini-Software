apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brandzo-erp-hpa
  namespace: brandzo-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brandzo-erp-deployment
  minReplicas: 5
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
